<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Hex Editor</title>
<style>
body{background:#111;color:#0f0;font:14px monospace;margin:8px}
textarea{width:100%;height:70vh;background:#000;color:#0f0}
button,input{margin:4px}
</style></head><body>
<input type=file id=f><button onclick=save()>Save</button><br>
<textarea id=t placeholder="Hex bytes (e.g. 48 65 6C 6C 6F)"></textarea>
<script>
let name="output.bin";
f.onchange=e=>{
 let file=e.target.files[0];
 if(!file)return;
 name=file.name;
 let r=new FileReader();
 r.onload=()=>{
  let b=new Uint8Array(r.result),s="";
  for(let i=0;i<b.length;i++)
   s+=b[i].toString(16).padStart(2,"0")+" ";
  t.value=s.trim();
 };
 r.readAsArrayBuffer(file);
};
function save(){
 let h=t.value.replace(/[^0-9a-f]/gi,"");
 if(h.length&1){alert("Invalid hex");return;}
 let b=new Uint8Array(h.length/2);
 for(let i=0;i<b.length;i++)
  b[i]=parseInt(h.substr(i*2,2),16);
 let a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([b]));
 a.download=name;
 a.click();
}
</script>
</body></html>.byte:hover{
    background:#444;
}
.selected{
    background:#0a84ff;
}
.offset{
    color:#6cf;
}
.ascii{
    color:#8f8;
}
</style>
</head>
<body>

<div id="toolbar">
<input type="file" id="file">
<button onclick="save()">Save</button>
<span id="info"></span>
</div>

<div id="editor"></div>

<script>

let bytes=new Uint8Array();
let filename="output.bin";
let selected=-1;

document.getElementById("file").onchange=e=>{
    const f=e.target.files[0];
    if(!f)return;
    filename=f.name;
    f.arrayBuffer().then(buf=>{
        bytes=new Uint8Array(buf);
        render();
    });
};

function render(){

    let out="";
    let ascii="";

    for(let i=0;i<bytes.length;i++){

        if(i%16===0){

            if(i>0){
                out+=" "+ascii+"\n";
            }

            ascii="";
            out+="<span class='offset'>"+
                i.toString(16).padStart(8,"0")+
                "</span> ";
        }

        let b=bytes[i];

        ascii+=
            (b>=32&&b<127)?
            String.fromCharCode(b):".";

        out+=
        "<span class='byte"+
        (selected===i?" selected":"")+
        "' data-i='"+i+"'>"+
        b.toString(16).padStart(2,"0").toUpperCase()+
        "</span> ";
    }

    while(bytes.length%16){
        out+="   ";
        ascii+=" ";
        bytes=bytes;
        if((bytes.length++)%16===0)break;
    }

    out+=" "+ascii;

    document.getElementById("editor").innerHTML=out;

    document.querySelectorAll(".byte").forEach(e=>{
        e.onclick=()=>edit(parseInt(e.dataset.i));
    });

    document.getElementById("info").textContent=
        bytes.length+" bytes";
}

function edit(i){

    selected=i;
    render();

    let v=prompt(
        "Hex value (00-FF)",
        bytes[i].toString(16).padStart(2,"0").toUpperCase()
    );

    if(v===null)return;

    v=v.trim();

    if(!/^[0-9a-fA-F]{2}$/.test(v)){
        alert("Invalid hex.");
        return;
    }

    bytes[i]=parseInt(v,16);
    render();
}

function save(){

    const blob=new Blob([bytes]);

    const a=document.createElement("a");

    a.href=URL.createObjectURL(blob);

    a.download=filename;

    a.click();

    URL.revokeObjectURL(a.href);
}

document.addEventListener("keydown",e=>{

    if(selected<0)return;

    if(e.key==="ArrowLeft"&&selected>0){
        selected--;
        render();
    }

    if(e.key==="ArrowRight"&&selected<bytes.length-1){
        selected++;
        render();
    }

    if(e.key==="ArrowUp"&&selected>=16){
        selected-=16;
        render();
    }

    if(e.key==="ArrowDown"&&selected<bytes.length-16){
        selected+=16;
        render();
    }

    if(e.key==="Enter"){
        edit(selected);
    }

});

</script>

</body>
</html>
